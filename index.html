<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.2">
  <title>Sistema de Gestão e Checklist de Coletores</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #cbd5e1;
      --success: #16a34a;
      --warning: #d97706;
      --danger: #dc2626;
      --radius: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { zoom: 1.15; background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; }

    .topbar { background: #1e293b; color: #fff; padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; }
    .topbar h1 { font-size: 1.2rem; }
    .nav-tabs { display: flex; gap: 12px; }
    .tab-btn { background: transparent; border: 1px solid #475569; color: #cbd5e1; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
    .tab-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .btn-adm { background: #334155; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; }

    .main-container { max-width: 1200px; width: 100%; margin: 24px auto; padding: 0 16px; flex: 1; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .grid-checklist { display: grid; grid-template-columns: 320px 1fr; gap: 24px; }
    .card { background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); padding: 24px; }
    .form-group { margin-bottom: 16px; display: flex; flex-direction: column; gap: 6px; }
    select, input { padding: 10px; border: 1px solid var(--border); border-radius: 6px; outline: none; }
    
    .checklist-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .check-item { display: flex; align-items: center; gap: 10px; padding: 10px; border: 1px solid var(--border); border-radius: 6px; background: #fff; cursor: pointer; }
    
    .actions { display: flex; justify-content: flex-end; gap: 12px; }
    button.btn { padding: 10px 20px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-reset { background: #e2e8f0; color: var(--text); }

    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 999; }
    .modal-overlay.active { display: flex !important; }
    .modal { background: #fff; border-radius: var(--radius); padding: 24px; width: 100%; max-width: 400px; }
    .admin-section { border-top: 1px solid var(--border); padding-top: 12px; margin-top: 12px; }
    .admin-list-item { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #f1f5f9; font-size: 0.85rem; }
    .btn-sm-danger { background: none; border: none; color: var(--danger); cursor: pointer; }
  </style>
</head>
<body>

<div class="topbar">
  <h1>Gestão de Coletores</h1>
  <div class="nav-tabs">
    <button class="tab-btn active" id="btnTabChecklist">Checklist Diário</button>
    <button class="tab-btn" id="btnTabRegistros">Histórico</button>
  </div>
  <button class="btn-adm" id="openLoginBtn">ADM</button>
</div>

<div class="main-container">
  <div id="tabChecklist" class="tab-content active">
    <div class="grid-checklist">
      <div class="card">
        <h2>Identificação</h2>
        <div class="form-group">
          <label>Número do Coletor</label>
          <select id="coletorSelect"></select>
        </div>
        <div class="form-group">
          <label>Responsável</label>
          <input type="text" id="responsavelInput" placeholder="Ex: ALISSON">
        </div>
      </div>
      <div class="card">
        <h2>Checklist</h2>
        <div class="checklist-grid" id="checklistContainer"></div>
        <div class="actions">
          <button class="btn btn-success" id="btnSaveRecord">Salvar Registro</button>
        </div>
      </div>
    </div>
  </div>

  <div id="tabRegistros" class="tab-content">
    <div class="card">
      <h2>Histórico de Registros</h2>
      <div id="recordsContainer" style="margin-top: 15px;"></div>
    </div>
  </div>
</div>

<!-- MODAL LOGIN -->
<div class="modal-overlay" id="loginModal">
  <div class="modal">
    <h2>Acesso ADM</h2>
    <div class="form-group" style="margin-top: 12px;">
      <label>Usuário</label>
      <input type="text" id="loginUser">
    </div>
    <div class="form-group">
      <label>Senha</label>
      <input type="password" id="loginPass">
    </div>
    <div class="actions">
      <button class="btn btn-reset" id="btnCancelLogin">Cancelar</button>
      <button class="btn btn-primary" id="btnLogin">Entrar</button>
    </div>
  </div>
</div>

<!-- MODAL PAINEL ADM -->
<div class="modal-overlay" id="admModal">
  <div class="modal">
    <div style="display:flex; justify-content:space-between;">
      <h2>Painel ADM</h2>
      <button class="btn-sm-danger" id="btnCloseAdm">✕</button>
    </div>
    <div class="admin-section">
      <h3>Coletores</h3>
      <div id="admColetoresList"></div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, set, onValue, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBM_WqhDckDzgtxPl1qi7oKU8QiMqHbJIQ",
    authDomain: "dashboard-revers.firebaseapp.com",
    databaseURL: "https://dashboard-revers-default-rtdb.firebaseio.com",
    projectId: "dashboard-revers",
    storageBucket: "dashboard-revers.firebasestorage.app",
    messagingSenderId: "121809447249",
    appId: "1:121809447249:web:253b34182189a3053d0b70"
  };

  let coletores = ["COL-01", "COL-02", "COL-03"];
  let itemsChecklist = ["Bateria 100%", "Tela Intacta", "Wi-Fi OK"];
  let adms = [{ user: "Giovanni", pass: "240223" }];

  // Renderização Básica
  function renderApp() {
    const coletorSelect = document.getElementById('coletorSelect');
    coletorSelect.innerHTML = '<option value="">Selecione...</option>';
    coletores.forEach(c => coletorSelect.innerHTML += `<option value="${c}">${c}</option>`);

    const container = document.getElementById('checklistContainer');
    container.innerHTML = '';
    itemsChecklist.forEach(i => {
      container.innerHTML += `<label class="check-item"><input type="checkbox"> <span>${i}</span></label>`;
    });
  }

  renderApp();

  // Eventos de Acesso ADM (Funciona mesmo sem BD)
  document.getElementById('openLoginBtn').onclick = () => document.getElementById('loginModal').classList.add('active');
  document.getElementById('btnCancelLogin').onclick = () => document.getElementById('loginModal').classList.remove('active');
  document.getElementById('btnCloseAdm').onclick = () => document.getElementById('admModal').classList.remove('active');

  document.getElementById('btnLogin').onclick = () => {
    const u = document.getElementById('loginUser').value;
    const p = document.getElementById('loginPass').value;
    if (adms.some(a => a.user === u && a.pass === p)) {
      document.getElementById('loginModal').classList.remove('active');
      document.getElementById('admModal').classList.add('active');
    } else {
      alert("Usuário ou Senha incorretos!");
    }
  };

  // Conexão Firebase com fallback de segurança
  try {
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    onValue(ref(db, 'coletores'), (snapshot) => {
      if (snapshot.exists()) {
        coletores = Object.values(snapshot.val());
        renderApp();
      }
    });
  } catch (err) {
    console.warn("Modo offline ativado ou erro de conexão:", err);
  }
</script>
</body>
</html>
